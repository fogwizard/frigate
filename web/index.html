<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vigil NVR</title>
  <meta http-equiv="Cache-Control" content="no-cache" />
    <link rel="stylesheet" href="/styles.css?v=8" />
</head>
<body>
  <header class="top">
    <div class="brand">Vigil</div>
    <nav>
      <button data-page="live" class="active">实时</button>
      <button data-page="events">事件</button>
      <button data-page="recordings">录像</button>
    </nav>
    <div id="events-pager" class="pager" hidden>
      <select id="events-camera" aria-label="摄像头">
        <option value="">全部</option>
      </select>
      <button id="events-newer" type="button" disabled>上翻50条</button>
      <span id="events-range"></span>
      <button id="events-older" type="button">下翻50条</button>
    </div>
    <div id="recordings-pager" class="pager" hidden>
      <select id="recordings-camera" aria-label="摄像头">
        <option value="">所有镜头</option>
      </select>
      <button id="recordings-newer" type="button" disabled>上翻50条</button>
      <span id="recordings-range"></span>
      <button id="recordings-older" type="button">下翻50条</button>
    </div>
    <div id="health" class="health">…</div>
    <div id="feed-serial" class="health">…</div>
    <div id="feed-next" class="health">…</div>
  </header>

  <main>
    <section id="page-live" class="page active">
      <h1>实时预览</h1>
      <p class="hint">有 go2rtc 时播放实时视频，否则回退到检测帧 JPEG。绿框是当前检测到的目标。</p>
      <div id="live-grid" class="grid"></div>
    </section>

    <section id="page-events" class="page">
      <h1>事件</h1>
      <div id="events-list" class="list"></div>
    </section>

    <section id="page-recordings" class="page">
      <h1>录像分段</h1>
      <div id="rec-list" class="list"></div>
    </section>
  </main>

    <script src="/app.js?v=18"></script>
</body>
</html>
