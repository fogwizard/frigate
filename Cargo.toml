[workspace]
resolver = "2"
members = [
    "crates/vigil-common",
    "crates/vigil-modbus",
    "crates/vigil",
    "crates/vigil-infer",
]

[workspace.package]
version = "0.1.9"
edition = "2021"
license = "MIT"
authors = ["Vigil Contributors"]

[workspace.dependencies]
vigil-common = { path = "crates/vigil-common" }
vigil-modbus = { path = "crates/vigil-modbus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "fs",
    "sync",
    "time",
    "process",
    "signal",
    "io-util",
    "macros",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "set-header"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ort = { version = "=2.0.0-rc.14", default-features = true, features = ["download-binaries", "ndarray", "std"] }
ndarray = "0.17"
memmap2 = "0.9"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
