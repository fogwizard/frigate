# Keep artifacts in-repo so local `target/` is visible (not a sandbox cache).
[build]
target-dir = "target"

# ONNX Runtime's prebuilt CoreML objects are compiled for macOS 13.4.
# Rust defaults to 11.0, and the release link then fails on
# ___isPlatformVersionAtLeast. 13.4 matches those objects; this OS is newer.
[env]
MACOSX_DEPLOYMENT_TARGET = "13.4"
