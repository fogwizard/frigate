# Vigil NVR — default configuration
# Copy to /etc/vigil/config.yaml on install and edit camera RTSP URLs.

mqtt: null

detect:
  fps: 5
  # Raw RGB24 pipe size (no JPEG). Must fit infer.shm_slot_bytes.
  width: 640
  height: 360
  labels: [person, cat, dog]
  score_threshold: 0.5
  # 画面没变化且当前没有目标时跳过模型。有人在画面里时仍按 detect.fps 检测，静止空场景每 5 秒复查一次。
  motion: true
  motion_threshold: 0.02

openvino:
  # device hint (ORT currently uses CPU; GPU EP reserved)
  device: CPU
  # YOLO11n / YOLOv8 ONNX (export: python scripts/export_model.py)
  # demo: powershell -File scripts/download_demo_model.ps1
  model: models/yolo11n.onnx

ffmpeg:
  # 改成你的 ffmpeg 路径；须能拉到下方 cameras 的 RTSP 才有画面
  binary: "C:/Users/jwi4szh/Desktop/prog/ffmpeg-2022-11-03-git-5ccd4d3060-full_build/bin/ffmpeg.exe"

infer:
  # Linux production: /run/vigil/infer.sock
  # Dev / Windows: 127.0.0.1:9870
  endpoint: "127.0.0.1:9870"
  binary: vigil-infer
  queue_size: 32
  # Frame ring in mmap (multi-slot cache); IPC only sends slot+seq
  shm_path: data/frames.shm
  shm_slots: 64
  shm_slot_bytes: 2764800

# USB 摄像头测试：enabled: true 后，指定 camera 用本机摄像头代替 RTSP。
# Windows 列设备: ffmpeg -list_devices true -f dshow -i dummy
# Linux 列设备:   ls /dev/video*  或  v4l2-ctl --list-devices
usb:
  enabled: true
  device: "HP 5MP Camera"
  camera: cam1
  width: 640
  height: 480
  fps: 15
  backend: dshow
  # go2rtc 未启动时务必保持 false，否则整路 FFmpeg 会退出、无画面
  restream: true
  # true = 只开 USB 这一路，跳过其它占位 RTSP
  only: true

# 大华 IPC / NVR。channel 从 1 开始；subtype=0 主码流（常见 H.265），subtype=1 子码流（常见 H.264）。
# 本进程一路 FFmpeg 同时录像、检测、推 go2rtc，请用 H.264 的子码流，微信 live-player 才能 -c copy 播放。
# 密码里的 @ : # & 空格要百分号编码。整段 URL 会作为单个参数传给 FFmpeg，& 不会被拆开。
# 示例：rtsp://admin:密码@192.168.1.108:554/cam/realmonitor?channel=1&subtype=1
cameras:
  cam1:
    feed_slave: 1
    ffmpeg:
      inputs:
        - path: rtsp://admin:password@192.168.1.108:554/cam/realmonitor?channel=1&subtype=1
          roles: [record, detect]
  cam2:
    feed_slave: 2
    ffmpeg:
      inputs:
        - path: rtsp://admin:password@192.168.1.108:554/cam/realmonitor?channel=2&subtype=1
          roles: [record, detect]
  cam3:
    feed_slave: 3
    ffmpeg:
      inputs:
        - path: rtsp://admin:password@192.168.1.108:554/cam/realmonitor?channel=3&subtype=1
          roles: [record, detect]
  cam4:
    feed_slave: 4
    ffmpeg:
      inputs:
        - path: rtsp://admin:password@192.168.1.108:554/cam/realmonitor?channel=4&subtype=1
          roles: [record, detect]
  cam5:
    feed_slave: 5
    ffmpeg:
      inputs:
        - path: rtsp://admin:password@192.168.1.108:554/cam/realmonitor?channel=5&subtype=1
          roles: [record, detect]

record:
  enabled: true
  retain_days: 7
  segment_secs: 60

events:
  retain_days: 14
  pre_capture_secs: 5
  post_capture_secs: 5

# webhook:
#   url: http://127.0.0.1:9000/hook

web:
  bind: "0.0.0.0:8970"

# WeChat mini-program HTTP-FLV (go2rtc + Nginx).
# Restream: Vigil FFmpeg publishes RTSP to go2rtc; go2rtc serves real HTTP-FLV for live-player.
# See packaging/go2rtc.yaml and packaging/nginx-flv.conf.example
stream:
  enabled: true
  # 需要先启动 go2rtc（:8554）再设 true；否则 FFmpeg 会因推流失败退出
  restream: false
  # Must match go2rtc rtsp.listen + stream name (publisher)
  publish_url_template: "rtsp://127.0.0.1:8554/{camera}"
  # Nginx maps /{camera}.flv → go2rtc /api/stream.flv?src={camera}
  public_base: "https://stream.example.com"
  path_template: "/{camera}"
  # 小程序 live-player 使用的地址，与 ffplay 验证过的 go2rtc HTTP-FLV 一致
  play_url_template: "http://127.0.0.1:1984/api/stream.flv?src={camera}"
  sign_secret: "change-me"
  sign_ttl_secs: 120

# 喂食最后一步：按 Modbus RTU（8N1）写一帧到串口，并等待从站回显。
# 等待窗口是 500 个字符时间：9600 波特约 1ms/字节，即 500ms。超时无应答记「写入失败」。
# 从站地址在各摄像头的 feed_slave 上，用来区分同一总线上的喂食器。
# 默认功能码 0x06 写单个保持寄存器。port 为空则只鉴权、不写串口。
feed:
  port: ""          # Windows: COM3   Linux: /dev/ttyUSB0 ；启动时打开，退出时关闭
  baud: 9600
  function: 6       # 5=写线圈  6=写单个寄存器
  address: 0
  value: 1
  timeout_ms: 500   # 兼容旧配置；实际等待由波特率换算

# Mini-program login / boarding / door / feed / water (see examples/miniprogram)
miniprogram:
  enabled: true
  demo_mode: true
  demo_openid: "demo-admin"
  admin_openids: ["demo-admin"]
  # Empty = admin canControl all cameras in demo
  control_cameras: []
  wechat_app_id: ""
  wechat_app_secret: ""
  session_ttl_secs: 86400

paths:
  data_dir: data
  db_path: data/vigil.db
