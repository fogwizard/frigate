# Vigil NVR — default configuration
# Copy to /etc/vigil/config.yaml on install and edit camera RTSP URLs.

mqtt: null

detect:
  fps: 5
  # Raw RGB24 pipe size (no JPEG). Must fit infer.shm_slot_bytes.
  width: 640
  height: 360
  labels: [person, cat, dog]
  score_threshold: 0.5
  # 画面没变化且当前没有目标时跳过模型。有人在画面里时仍按 detect.fps 检测，静止空场景每 5 秒复查一次。
  motion: true
  motion_threshold: 0.02

openvino:
  # device hint (ORT currently uses CPU; GPU EP reserved)
  device: CPU
  # YOLO11n / YOLOv8 ONNX (export: python scripts/export_model.py)
  # demo: powershell -File scripts/download_demo_model.ps1
  model: models/yolo11n.onnx

ffmpeg:
  # 改成你的 ffmpeg 路径；须能拉到下方 cameras 的 RTSP 才有画面。
  # macOS 一般是 PATH 上的 ffmpeg（brew install ffmpeg）。
  binary: ffmpeg

infer:
  # Linux production: /run/vigil/infer.sock
  # Dev / Windows: 127.0.0.1:9870
  endpoint: "127.0.0.1:9870"
  binary: vigil-infer
  queue_size: 32
  # Frame ring in mmap (multi-slot cache); IPC only sends slot+seq
  shm_path: data/frames.shm
  shm_slots: 64
  shm_slot_bytes: 2764800

# USB 摄像头测试：enabled: true 后，指定 camera 用本机摄像头代替 RTSP。
# Windows 列设备: ffmpeg -list_devices true -f dshow -i dummy
# macOS 列设备:   ffmpeg -f avfoundation -list_devices true -i ""
# Linux 列设备:   ls /dev/video*  或  v4l2-ctl --list-devices
usb:
  enabled: false
  device: "0"
  camera: cam1
  width: 640
  height: 480
  fps: 15
  backend: avfoundation
  # 推到 go2rtc。vigil 启动时会先把 go2rtc 拉起来。
  restream: true
  # true = 只开 USB 这一路，跳过其它占位 RTSP
  only: false

# 大华 IPC / NVR。channel 从 1 开始；subtype=0 主码流（常见 H.265），subtype=1 子码流（常见 H.264）。
# 本进程一路 FFmpeg 同时录像、检测、推 go2rtc，请用 H.264 的子码流，微信 live-player 才能 -c copy 播放。
# 密码里的 @ : # & 空格要百分号编码。整段 URL 会作为单个参数传给 FFmpeg，& 不会被拆开。
# 四台独立 IPC，每台 channel=1。subtype=1 为子码流。
# 示例：rtsp://admin:密码@192.168.1.5:554/cam/realmonitor?channel=1&subtype=1
cameras:
  cam1:
    feed_slave: 1
    feed_time: 30          # 秒。0 表示这路不喂食
    ffmpeg:
      inputs:
        - path: rtsp://admin:jwf6061120@192.168.1.20:554/cam/realmonitor?channel=1&subtype=0
          roles: [record, detect]
  cam2:
    feed_slave: 2
    feed_time: 30
    ffmpeg:
      inputs:
        - path: rtsp://admin:jwf6061120@192.168.1.5:554/cam/realmonitor?channel=1&subtype=0
          roles: [record, detect]
  cam3:
    feed_slave: 3
    feed_time: 30
    ffmpeg:
      inputs:
        - path: rtsp://admin:jwf6061120@192.168.1.7:554/cam/realmonitor?channel=1&subtype=0
          roles: [record, detect]
  cam4:
    feed_slave: 4
    feed_time: 30
    ffmpeg:
      inputs:
        - path: rtsp://admin:jwf6061120@192.168.1.9:554/cam/realmonitor?channel=1&subtype=0
          roles: [record, detect]

record:
  enabled: true
  # 每分钟看一次 data 目录。超过这个大小就按文件名时间删最旧的录像，直到回到限额以下。
  # 每一路正在写入的最新分段会留下。同一时间之前的事件和片段一起删。
  max_gb: 100
  segment_secs: 60

events:
  pre_capture_secs: 5
  post_capture_secs: 5

# webhook:
#   url: http://127.0.0.1:9000/hook

web:
  # 只在本机和局域网监听。不要在路由器上把 8970 映射到公网。
  # 手机离网后的登录走 Caddy 白名单 + FRP，见 packaging/Caddyfile。
  bind: "0.0.0.0:8970"

# WeChat mini-program video. Caddy turns /{camera}.m3u8 and /{camera}.flv
# into go2rtc /api/stream.* URLs. Play returns the .m3u8 URL for <video>.
# See packaging/Caddyfile. Do not send the phone this Mac's LAN address.
# 本机能找到 go2rtc 就拉起；找不到则打印远程启动命令，由另一台机器执行。工作目录是项目根目录。
go2rtc:
  binary: go2rtc
  config: packaging/go2rtc.yaml
  api: "122.51.106.239:1984"

stream:
  enabled: true
  # 推流到服务器上的 go2rtc。8554 不通时整路 ffmpeg 会退出，页面就没有画面。
  restream: true
  # Must match go2rtc rtsp.listen + stream name (publisher)
  publish_url_template: "rtsp://122.51.106.239:8554/{camera}"
  # 手机播放和登录用的公网地址，不要带端口，也不要带 ?src=。
  # 小程序 app.js 的 apiBase 必须与这里相同。
  # 域名证书就绪后只改这一行：https://rujibao.cn
  public_base: "http://122.51.106.239"
  path_template: "/{camera}"
  # 本机网页预览仍走 go2rtc 的 HTTP-FLV，不给小程序用。
  play_url_template: "http://122.51.106.239:1984/api/stream.flv?src={camera}"
  sign_secret: "change-me"
  sign_ttl_secs: 120

# 喂食最后一步：按 Modbus RTU（8N1）写一帧到串口，并等待从站回显。
# 等待窗口是 500 个字符时间：9600 波特约 1ms/字节，即 500ms。超时无应答记「写入失败」。
# 从站地址在各摄像头的 feed_slave 上，用来区分同一总线上的喂食器。
# 默认功能码 0x06 写单个保持寄存器。port 为空则只鉴权、不写串口。
# 每个摄像头在本机本地时间 7:00–8:00 内一天只喂一次。
# 写 value 打开，经过该摄像头的 feed_time 秒后写 close_value 关闭。过了 8:00 不再尝试。
# 喂食录像剪好后交给本机 Qwen 视觉模型判断粮食有没有出来。
# base_url 是 OpenAI 兼容接口，model 要和本机服务里的模型名一致。
feed:
  port: "/dev/cu.usbserial-110"  # macOS cu.*；Windows COM3；Linux /dev/ttyUSB0。空=不写串口
  baud: 9600
  function: 6       # 5=写线圈  6=写单个寄存器
  address: 0
  value: 1          # 打开喂食器
  close_value: 0    # 关闭喂食器
  timeout_ms: 500   # 兼容旧配置；实际等待由波特率换算
  vlm:
    base_url: http://127.0.0.1:8000/v1
    model: qwen-vl-max-latest
    api_key: ""

# Mini-program login / boarding / door / feed / water (see examples/miniprogram)
miniprogram:
  enabled: true
  # false 时用下面的 AppID 和 AppSecret 向微信换真实 OpenID。
  demo_mode: false
  demo_openid: "demo-admin"
  admin_openids: ["demo-admin"]
  # Empty = admin canControl all cameras in demo
  control_cameras: []
  wechat_app_id: "wxf0f322b8b47eb741"
  wechat_app_secret: "0ad9dc0cfa05d063fed5925e32933ed9"
  session_ttl_secs: 86400

paths:
  data_dir: data
  db_path: data/vigil.db
